services:
  db:
    image: postgres:16
    container_name: finance-tracker-db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_password
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
